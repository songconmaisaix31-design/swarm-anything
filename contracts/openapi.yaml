openapi: 3.1.0
info:
  title: Astrocyte HTTP v1
  version: 1.0.0
  description: SPEC v0.1 local foundation and S1 Attention contracts. Supported
    operations are explicitly marked; unassembled capabilities fail with 501.
    S1 protected reads use the local human session and writes require CSRF;
    request bodies never supply trusted actor identity. Fixture examples and
    CLI installation observations are not native execution or S1 acceptance evidence.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Loopback-only local backend
security: []
tags:
  - name: workspace
    description: Current project goals and approved proposal commands
  - name: health
    description: health HTTP v1 contract
  - name: foundation
    description: foundation HTTP v1 contract
  - name: materials
    description: materials HTTP v1 contract
  - name: opportunities
    description: opportunities HTTP v1 contract
  - name: projects
    description: projects HTTP v1 contract
  - name: proposals
    description: proposals HTTP v1 contract
  - name: sessions
    description: sessions HTTP v1 contract
  - name: missions
    description: missions HTTP v1 contract
  - name: approvals
    description: approvals HTTP v1 contract
  - name: work-items
    description: work-items HTTP v1 contract
  - name: artifacts
    description: artifacts HTTP v1 contract
  - name: events
    description: events HTTP v1 contract
  - name: local-agents
    description: Cached local CLI readiness and native capability observations
  - name: attention-engine
    description: Cognitive-core engine manual gates (knowledge confirm, experience
      approve, conflict adjudication)
  - name: cognition
    description: Read-only confirmed cognitive snapshots
  - name: relay
    description: Human confirmed Works Relay access layer
paths:
  /local-projects/{id}/orca/commands:
    post:
      operationId: executeOrcaCommand
      x-s1-supported: true
      summary: Execute one authorized command against the installed private Orca runtime
      description: Uses current project grants and fixed context. Mutations require the same canonical UUID in request_id and Idempotency-Key. Native Run, Task, Dispatch, receipt and transcript remain authoritative; unknown operations are never resent automatically. Authenticated human safety stops recheck exact native ownership and remain available after execution approval changes.
      tags: [workspace]
      security: [{HumanSession: []}, {AgentBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/S2ID'}
        - {name: Idempotency-Key, in: header, required: false, description: Required for mutation and original request lookup, schema: {type: string, format: uuid}}
        - {name: X-CSRF-Token, in: header, required: false, description: Required for an authenticated human POST; project Agent bearer requests use their current scoped grant, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: './swa-cli.schema.json#/$defs/command'}}}
      responses:
        '200': {description: Actual native result and identities, content: {application/json: {schema: {$ref: './swa-cli.schema.json#/$defs/envelope'}}}}
        '400': {$ref: '#/components/responses/S2CommandError'}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        '409': {description: Actual native refusal or unknown outcome, content: {application/json: {schema: {oneOf: [{$ref: './swa-cli.schema.json#/$defs/envelope'}, {$ref: '#/components/schemas/ErrorV1'}]}}}}
        '500': {$ref: '#/components/responses/S2CommandError'}
        '501': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /openviking/status:
    get:
      operationId: getOpenVikingStatus
      summary: Read optional OpenViking configuration and verified identity
      tags: [materials]
      x-s1-supported: true
      security: [{HumanSession: []}]
      responses:
        '200': {description: Unconfigured or verified connected state, content: {application/json: {schema: {$ref: '#/components/schemas/OpenVikingStatusV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /project-spaces/{id}/openviking/submissions:
    get:
      operationId: listOpenVikingSubmissions
      summary: Read actual persistent submissions in one project space
      tags: [materials]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1}}]
      responses:
        '200': {description: Actual local records including unknown outcomes, content: {application/json: {schema: {$ref: '#/components/schemas/OpenVikingSubmissionListV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
    post:
      operationId: submitOpenVikingSource
      summary: Human approves sending one included fixed revision to the current destination
      description: Credentials do not authorize sending. Existing in-flight or unknown submissions prevent a second upstream action, including with a new request_id. No automatic replay.
      tags: [materials]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1}}, {$ref: '#/components/parameters/S2Idempotency'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OpenVikingSubmitRequestV1'}}}
      responses:
        '202': {description: Submission recorded; completed requires actual task observation, content: {application/json: {schema: {$ref: '#/components/schemas/OpenVikingSubmissionResultV1'}}}}
        '400': {$ref: '#/components/responses/S2CommandError'}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        '409': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /openviking/submissions/{id}/refresh:
    post:
      operationId: refreshOpenVikingSubmission
      summary: Observe the upstream task linked to one local submission
      description: Reads the persisted task_id and saves its actual observation. Never resubmits upload or resource creation.
      tags: [materials]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1}}, {$ref: '#/components/parameters/ProductCSRF'}]
      responses:
        '200': {description: Actual task observation, content: {application/json: {schema: {$ref: '#/components/schemas/OpenVikingSubmissionResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        '409': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /project-spaces/{id}/openviking/search:
    post:
      operationId: searchOpenVikingProject
      summary: Human searches the current project destination
      tags: [materials]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1}}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [query], properties: {query: {type: string, minLength: 1, maxLength: 8000}}}
      responses:
        '200':
          description: Verified project resources; out-of-scope results fail the whole response
          content:
            application/json:
              schema: {type: object, additionalProperties: false, required: [schema_version, items], properties: {schema_version: {const: 1}, items: {type: array, items: {$ref: '#/components/schemas/OpenVikingHitV1'}}}}
        '400': {$ref: '#/components/responses/S2CommandError'}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /project-spaces/{id}/openviking/content:
    post:
      operationId: readOpenVikingProjectContent
      summary: Read one authorized resource tier using its actual URI
      description: L0 and L1 read directory abstract or overview; L2 reads file text. URI and current fixed project permission are checked before and after reading.
      tags: [materials]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, minLength: 1}}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [uri, level], properties: {uri: {type: string, minLength: 1}, level: {type: integer, enum: [0, 1, 2]}}}
      responses:
        '200':
          description: Actual string content from the selected tier
          content:
            application/json:
              schema: {type: object, additionalProperties: false, required: [schema_version, content], properties: {schema_version: {const: 1}, content: {type: string}}}
        '400': {$ref: '#/components/responses/S2CommandError'}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /experiences/completions:
    post:
      operationId: captureCompletionExperience
      summary: Draft an experience from one actual completed task
      description: Human-only command bound to an actual LocalProject.ID and immutable completion event. Missing Interpreter returns provider_unavailable; unknown model delivery is never replayed. A successful candidate remains quarantine until the user approves it.
      tags: [attention-engine]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/S2Idempotency'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CaptureCompletionExperienceRequestV1'}}}
      responses:
        '200': {description: Original or newly persisted quarantine candidate, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceReadResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /experiences/{id}/evidence:
    get:
      operationId: readExperienceEvidence
      summary: Resolve safe references using current project permissions
      tags: [attention-engine]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters:
        - {$ref: '#/components/parameters/S2ID'}
        - {name: project_id, in: query, required: true, schema: {type: string, minLength: 1}, description: Actual registered LocalProject.ID}
      responses:
        '200': {description: Safe references without original source payloads, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceEvidenceResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /admissions/{id}:
    get:
      operationId: readOpportunityAdmission
      summary: Read the original human or delegated admission
      tags: [opportunities]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/S2ID'}]
      responses:
        '200': {description: Persisted admission and any original draft reference, content: {application/json: {schema: {$ref: '#/components/schemas/AdmissionResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /admissions/{id}/revocations:
    post:
      operationId: revokeOpportunityAdmission
      summary: Revoke a current admission with an explicit human reason
      description: Does not change a separately issued execution grant.
      tags: [opportunities]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/S2ID'}, {$ref: '#/components/parameters/S2Idempotency'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RevokeAdmissionRequestV1'}}}
      responses:
        '200': {description: Persisted revoked admission, content: {application/json: {schema: {$ref: '#/components/schemas/AdmissionResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /attention-taste-profile:
    get:
      operationId: readAttentionTasteProfile
      summary: Read current human taste configuration
      tags: [attention-engine]
      x-s1-supported: true
      security: [{HumanSession: []}]
      responses:
        '200': {description: Current actual profile or configured false and profile null, content: {application/json: {schema: {$ref: '#/components/schemas/TasteProfileResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
    put:
      operationId: updateAttentionTasteProfile
      summary: Save an explicit versioned human taste profile
      tags: [attention-engine]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/S2Idempotency'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTasteProfileRequestV1'}}}
      responses:
        '200': {description: Persisted current profile, content: {application/json: {schema: {$ref: '#/components/schemas/TasteProfileResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/judgment-snapshots:
    post:
      operationId: captureJudgmentSnapshot
      summary: Capture explicitly selected approved files
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [files], properties: {files: {type: array, minItems: 1, items: {type: string}}}}
      responses:
        '200': {description: Snapshot with an empty public root, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentSnapshotResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/judgment-policies/{question_type}:
    get:
      operationId: readJudgmentPolicy
      summary: Read the current question policy under human authority
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentQuestionType'}]
      responses:
        '200': {description: Current fixed policy, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentPolicyResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
    put:
      operationId: updateJudgmentPolicy
      summary: Save an explicit current-project policy
      description: Requires an actual snapshot, matching settings revision and approved sources. Public snapshot root is empty; the internal root comes from the authorized project.
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentQuestionType'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expected_revision, policy], properties: {expected_revision: {type: integer, minimum: 0}, policy: {$ref: '#/components/schemas/JudgmentPolicyV1'}}}
      responses:
        '200': {description: Saved policy, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentPolicyResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/judgments:
    post:
      operationId: submitProjectJudgment
      summary: Evaluate an explicitly authorized fixed-source question
      description: The body project must match the path. Context-bound questions use the delegation workflow. Backend, language and budgets are supplied explicitly; unavailable configured models fail without a replacement.
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}, {AgentBearer: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentRequestV1'}}}
      responses:
        '200': {description: Actual result with source and usage status, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentResultEnvelopeV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/judgments/{decision_id}:
    get:
      operationId: readProjectJudgment
      summary: Read an actual judgment under current source permissions
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}, {AgentBearer: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentDecisionID'}]
      responses:
        '200': {description: Original judgment, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentResultEnvelopeV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/judgments/{decision_id}/feedback:
    get:
      operationId: readJudgmentFeedback
      summary: Read actual feedback for the fixed judgment
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}, {AgentBearer: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentDecisionID'}]
      responses:
        '200': {description: Persisted feedback list, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentFeedbackListV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
    post:
      operationId: recordJudgmentFeedback
      summary: Record explicit human feedback for the exact result version
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentDecisionID'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentFeedbackRequestV1'}}}
      responses:
        '200': {description: Persisted feedback, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentFeedbackResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/delegation-rules:
    get:
      operationId: listJudgmentDelegationRules
      summary: List current project delegation rules
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}]
      responses:
        '200': {description: Actual versioned rules, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationRuleListV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/delegation-rules/{rule_id}:
    get:
      operationId: readJudgmentDelegationRule
      summary: Read the original current-project rule
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentRuleID'}]
      responses:
        '200': {description: Versioned rule, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationRuleResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
    put:
      operationId: updateJudgmentDelegationRule
      summary: Save an explicit human delegation rule
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentRuleID'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expected_revision, rule], properties: {expected_revision: {type: integer, minimum: 0}, rule: {$ref: '#/components/schemas/DelegationRuleV1'}}}
      responses:
        '200': {description: Saved rule, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationRuleResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/delegation-rules/{rule_id}/state:
    post:
      operationId: changeJudgmentDelegationState
      summary: Apply an explicit current rule state change
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentRuleID'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expected_revision, state], properties: {expected_revision: {type: integer, minimum: 1}, state: {type: string}}}
      responses:
        '200': {description: Saved rule state, content: {application/json: {schema: {$ref: '#/components/schemas/DelegationRuleResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/delegation-rules/{rule_id}/judgments:
    post:
      operationId: evaluateJudgmentDelegation
      summary: Evaluate a fixed opportunity using its current authorized rule
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentRuleID'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [rule_revision, opportunity_id, opportunity_revision], properties: {rule_revision: {type: integer, minimum: 1}, opportunity_id: {type: string}, opportunity_revision: {type: integer, minimum: 1}}}
      responses:
        '200': {description: Actual bound judgment, content: {application/json: {schema: {$ref: '#/components/schemas/JudgmentResultEnvelopeV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /local-projects/{project_id}/judgments/{decision_id}/admissions:
    post:
      operationId: admitDelegatedJudgment
      summary: Consume a complete authorized judgment into a draft proposal
      tags: [local-agents]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters: [{$ref: '#/components/parameters/JudgmentProjectID'}, {$ref: '#/components/parameters/JudgmentDecisionID'}, {$ref: '#/components/parameters/S2Idempotency'}, {$ref: '#/components/parameters/ProductCSRF'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [schema_version, request_id, expected_opportunity_version], properties: {schema_version: {type: integer, const: 1}, request_id: {type: string}, expected_opportunity_version: {type: integer, minimum: 1}}}
      responses:
        '200': {description: Original admission and draft proposal references, content: {application/json: {schema: {$ref: '#/components/schemas/DelegatedAdmissionResultV1'}}}}
        '403': {$ref: '#/components/responses/S2CommandError'}
        default: {$ref: '#/components/responses/S2CommandError'}
  /relay/intents/{id}/prepare:
    post:
      operationId: prepareRelayIntent
      summary: Initialize the original owned controller with an empty message
      description: Human permission confirmation reserves the original workspace and initializes the same controller without a model input. The task remains ready. First input requires a separate Confirm operation; delivery_unknown must never be replayed.
      tags: [relay]
      x-s1-supported: true
      security: [{HumanSession: []}]
      parameters:
        - {$ref: '#/components/parameters/S2ID'}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 1}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RelayConfirmRequestV1'}}}}
      responses:
        '200': {description: Original initialization receipt and current ready task, content: {application/json: {schema: {$ref: '#/components/schemas/RelayActionResultV1'}}}}
        '400': {$ref: '#/components/responses/S2CommandError'}
        '403': {$ref: '#/components/responses/S2CommandError'}
        '404': {$ref: '#/components/responses/S2CommandError'}
        '409': {$ref: '#/components/responses/S2CommandError'}
        '500': {$ref: '#/components/responses/S2CommandError'}
        '501': {$ref: '#/components/responses/S2CommandError'}
        '503': {$ref: '#/components/responses/S2CommandError'}
  /context-packets:
