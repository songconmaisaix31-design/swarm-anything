    ImportMaterialRequestV1:
      type: object
      additionalProperties: false
      properties:
        refresh:
          type: boolean
          description: Ordinary import reuses the existing extraction; only explicit human refresh obtains new content.
        schema_version:
          type: integer
          const: 1
        request_id:
          type: string
        expected_version:
          type: integer
          minimum: 1
        source_locator:
          type: string
        source_key:
          type: string
          description: Empty string requests adapter canonical source key; nonempty keys
            are verified by the adapter.
        kind:
          type: string
          enum:
            - paper
            - video
            - text
            - file
        content_digest:
          type: string
          description: Empty string requests server digest computation; a nonempty digest
            is verified against actual imported bytes.
        export_text:
          type: string
        local_file_ref:
          type: string
        collection_reason:
          type:
            - string
            - "null"
        source_spans:
          type: array
          items:
            type: string
        title:
          type: string
        adapter:
          type: string
          enum:
            - arxiv
            - paper_url
            - paper_pdf
            - paper_snapshot
            - summarize_url
            - summarize
            - summarize_json
            - summarize_markdown
            - manual
          description: summarize_url extracts a selected public video URL without export_text
            or local_file_ref. summarize, summarize_json and summarize_markdown import existing
            exports. paper_url extracts a selected public paper HTML body; paper_pdf extracts
            a selected public paper PDF; paper_snapshot ingests a human-reviewed browser-plugin
            snapshot JSON supplied as export_text (no network or model call). Extraction does
            not imply model distillation or Agent authorization.
      required:
        - schema_version
        - request_id
        - expected_version
        - source_locator
        - source_key
        - kind
        - content_digest
      examples:
        - schema_version: 1
