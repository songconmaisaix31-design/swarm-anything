  /knowledge/{id}/confirm:
    post:
      operationId: confirmKnowledge
      summary: Confirm a KnowledgeEntry for workspace reference
      description: Human gate that moves a KnowledgeEntry from inbox to confirmed so a
        Project Workspace may reference it. M0 returns 501; the assembled gate
        (W4 store) performs exactly one status transition and no model call.
      tags:
        - attention-engine
      x-s0-supported: false
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: KnowledgeEntry identifier
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Caller-scoped command deduplication key; never automatic retry
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
          description: Session-bound CSRF token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmKnowledgeRequestV1"
      responses:
        "200": &gateSuccess
          description: Confirmed entry (future DTO only in M0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmKnowledgeResultV1"
              example:
                schema_version: 1
                entry:
                  id: k-1
                  topic: attention-engine
                  fluid: evolving summary
                  crystallized:
                    fact: "true"
                  sources:
                    - event_id: e-1
                      ts: 1700000000000
                  status: confirmed
                version: 2
                owner_project: fixture-project
        "400": &gateErr400
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "403": &gateErr403
          description: Scope or user-control access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "404": &gateErr404
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "409": &gateErr409
          description: Resource version or status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "500": &gateErr500
          description: Unexpected service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
        "501": &gateErr501
          description: Capability is not implemented in M0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorV1"
              example:
                schema_version: 1
                error:
                  code: unsupported_capability
                  message: Capability is not implemented in M0
                  request_id: example-request
                  retryable: false
                  required_action: Read the current capabilities; choose an implemented operation
      security:
        - HumanSession: []
