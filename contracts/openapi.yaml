components:
  parameters:
    ProductCSRF: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 1}, description: Required for authenticated human writes}
    JudgmentProjectID: {name: project_id, in: path, required: true, schema: {type: string, minLength: 1}}
    JudgmentDecisionID: {name: decision_id, in: path, required: true, schema: {type: string, minLength: 1}}
    JudgmentRuleID: {name: rule_id, in: path, required: true, schema: {type: string, minLength: 1}}
    JudgmentQuestionType: {name: question_type, in: path, required: true, schema: {type: string, enum: [choice, score, truth]}}
    S2ID: {in: path, name: id, required: true, schema: {type: string, minLength: 1}}
    S2Revision: {in: query, name: revision, required: false, schema: {type: integer, minimum: 1}}
    S2Idempotency: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 1}, description: 'Caller-scoped immutable operation. Human writes also require existing session CSRF. Request ID is transport trace and may differ on replay.'}
  responses:
    S2CommandError: {description: 'Invalid command, current permission denial, version conflict or unavailable dependency. No execution retry.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorV1'}}}}
  schemas:
    SwaTaskSpecV1:
      $ref: './swa-cli.schema.json#/$defs/taskSpec'
    SwaRegisteredAgentV1:
      $ref: './swa-cli.schema.json#/$defs/registeredAgent'
    SwaAgentCapabilitiesV1:
      $ref: './swa-cli.schema.json#/$defs/capabilities'
    SwaAgentSelectionV1:
      $ref: './swa-cli.schema.json#/$defs/agentSelection'
    SwaNativeLaunchPolicyV1:
      $ref: './swa-cli.schema.json#/$defs/nativeLaunchPolicy'
    OpenVikingStatusV1:
      type: object
      additionalProperties: false
      required: [schema_version, configured, connected, base_url, root_uri, version, user, account, message]
      properties:
        schema_version: {const: 1}
        configured: {type: boolean}
        connected: {type: boolean}
        base_url: {type: string}
        root_uri: {type: string}
        version: {type: string}
        user: {type: string}
        account: {type: string}
        message: {type: string}
    OpenVikingSubmissionV1:
      type: object
      additionalProperties: false
      required: [id, version, request_id, space_id, space_version, material_id, revision, locator, title, destination, base_url, account, user, actor_id, approved_at, updated_at, status, stage, temp_file_id, task_id, root_uri, error, task_snapshot]
      properties:
        id: {type: string, minLength: 1}
        version: {type: integer, minimum: 1}
        request_id: {type: string, minLength: 1}
        space_id: {type: string, minLength: 1}
        space_version: {type: integer, minimum: 1}
        material_id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
        locator: {type: string}
        title: {type: string}
        destination: {type: string}
        base_url: {type: string}
        account: {type: string}
        user: {type: string}
        actor_id: {type: string}
        approved_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        status: {type: string, enum: [submitting, submitted, pending, running, cancelling, completed, failed, cancelled, unknown]}
        stage: {type: string}
        temp_file_id: {type: string}
        task_id: {type: string}
        root_uri: {type: string}
        error: {type: string}
        task_snapshot: {type: [object, 'null'], additionalProperties: true}
    OpenVikingSubmissionListV1:
      type: object
      additionalProperties: false
      required: [schema_version, items]
      properties:
        schema_version: {const: 1}
        items: {type: array, items: {$ref: '#/components/schemas/OpenVikingSubmissionV1'}}
    OpenVikingSubmissionResultV1:
      type: object
      additionalProperties: false
      required: [schema_version, submission]
      properties:
        schema_version: {const: 1}
        submission: {$ref: '#/components/schemas/OpenVikingSubmissionV1'}
        task:
          type: [object, 'null']
          additionalProperties: true
    OpenVikingSubmitRequestV1:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, expected_version, expected_space_version, material_id, revision, destination, base_url, account, user]
      properties:
        schema_version: {const: 1}
        request_id: {type: string, minLength: 1}
        expected_version: {type: integer, const: 0}
        expected_space_version: {type: integer, minimum: 1}
        material_id: {type: string, minLength: 1}
        revision: {type: integer, minimum: 1}
        destination: {type: string, minLength: 1}
        base_url: {type: string, minLength: 1}
        account: {type: string, minLength: 1}
        user: {type: string, minLength: 1}
    OpenVikingHitV1:
      type: object
      additionalProperties: false
      required: [uri, abstract, overview, level, score, context_type]
      properties:
        uri: {type: string, minLength: 1}
        abstract: {type: string}
        overview: {type: [string, 'null']}
        level: {type: integer, enum: [0, 1, 2]}
        score: {type: number}
        context_type: {const: resource}
    CaptureCompletionExperienceRequestV1:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, expected_version, local_project_id, event_id]
      properties:
        schema_version: {type: integer, const: 1}
        request_id: {type: string, minLength: 1}
        expected_version: {type: integer, const: 1}
        local_project_id: {type: string, minLength: 1}
        event_id: {type: string, minLength: 1}
    CompletionArtifactReferenceV1:
      type: object
      additionalProperties: false
      required: [id, version, object_refs, inputs]
      properties:
        id: {type: string}
